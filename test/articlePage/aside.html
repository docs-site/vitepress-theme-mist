园是一个面向开发者的知识分享社区\",\"link\":\"https://www.cnblogs.com\"},{\"title\":\"知乎\",\"icon\":\"https://static.zhihu.com/heifetz/assets/apple-touch-icon-60.362a8eac.png\",\"desc\":\"中文互联网高质量的问答社区和创作者聚集的原创内容平台\",\"link\":\"https://juejin.cn\"}]}]},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"我的导航\",\"date\":\"2026-09-20 13:11:39\",\"capture\":\"欢迎访问网站导航页面！\\n\\n_导航页面功能已启用_\"},{\"url\":\"/@pages/archivesPage.html\",\"relativePath\":\"/@pages/archivesPage.html\",\"frontmatter\":{\"title\":\"归档\",\"permalink\":\"/archives\",\"archivesPage\":true,\"layout\":\"page\",\"article\":false,\"sidebar\":false},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"归档\",\"date\":\"2026-09-20 13:11:39\",\"capture\":\"\"},{\"url\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"relativePath\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"frontmatter\":{\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f358aca00c973\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"aca00c97343e49b0969d34bd184045b4\",\"useduuid\":\"aca00c973\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、工作区\\n\\npnpm 内置了对单一存储库（也称为多包存储库、多项目存储库或整体存储库）的支持。你可以创建一个工作区来将多个项目联合到一个存储库中。\\n&gt; 工作区的根目录中必须有一个 `pnpm-workspace.yaml` 文件。\\n 1. 工作区协议\\n如果 linkWorkspacePackages 设置为 `true`，如果可用包与声明的范围匹配，pnpm 将从工作区链接包。例如，如果 `bar` 在其依赖中有 `\\\"foo\\\": \\\"^1.0.0\\\"` 并且 `foo@1.0.0` 在工作区中，则 `foo@1.0.0` 链接到 `bar`。但是，如果 `bar` 在依赖中有 `\\\"foo\\\"\"},{\"url\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"relativePath\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"frontmatter\":{\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35ac666f44fe\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"c666f44fe5f046c8aadb8491cd6f64bf\",\"useduuid\":\"c666f44fe\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、Typescript路径映射\\nTypescript 路径映射（Path Mapping）是一种允许开发者在导入模块时使用自定义路径别名而不是相对路径的功能。这使得代码更加清晰、易于维护，并且在重构项目结构时更加方便。\\n 1. 基本概念\\n路径映射通过在 `tsconfig.json` 文件中配置 `paths` 和 `baseUrl` 来实现。`baseUrl` 指定了非相对路径模块的基础目录，`paths` 则定义了路径别名与实际路径之间的映射关系。\\n路径映射的核心价值在于解决深层嵌套目录结构中的导入问题。当项目变得复杂时，相对路径可能会变成类似 `../../../../utils/he\"},{\"url\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"relativePath\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"frontmatter\":{\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35b1b55cd5b5\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1b55cd5b599645c698ef650c2ec2c57e\",\"useduuid\":\"1b55cd5b5\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、开发指南\\n主题的主入口文件为`packages/mist/index.ts`，这里的index.ts将会在vitepress站点的`.vitepress/theme/index.ts`中导入和调用。\\n 二、Workspace 机制详解\\n 1. 项目配置分析\\n 1.1 pnpm-workspace.yaml\\n```yaml\\n pnpm-workspace.yaml\\npackages:\\n  - docs\\n  - packages/*\\n```\\n这个配置定义了 Workspace 的范围，包含了 `packages` 目录下的所有子目录。\\n 1.2 packages/mist/package.js\"},{\"url\":\"/sdoc/01-开发/LV010-主题配置.html\",\"relativePath\":\"/sdoc/01-开发/LV010-主题配置.html\",\"frontmatter\":{\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35cbff754d8c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"bff754d8c11b4e32b841c3d7e9378444\",\"useduuid\":\"bff754d8c\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"<p>vitepress的配置合并。</p>\\n\",\"capture\":\"vitepress的配置合并。\\n 一、概述\\n当建立一个vitepress站点后，得到的默认配置文件如下：\\n```typescript\\nimport { defineConfig } from \\\"vitepress\\\";\\n// https://vitepress.dev/reference/site-config\\nexport default defineConfig({\\n  title: \\\"mist docs\\\",\\n  description: \\\"vitepress-theme-mist docs\\\",\\n  themeConfig: {\\n    // https://vitepress.dev/re\"},{\"url\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"relativePath\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"frontmatter\":{\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35e8787d3ad7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"8787d3ad7f354a63bb729e008862f309\",\"useduuid\":\"8787d3ad7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"DataLoader 组件导入过程分析\\n本文档详细分析了 DataLoader 组件在项目中的目录结构、各文件作用以及从组件实现到最终在 `@docs-site/vitepress-theme-mist` 主题中注册的完整导入链路。\\n 1. 目录结构分析\\n 1.1 目录结构\\n```bash\\n📁 DataLoader/\\n├── 📄 index.ts                    组件主入口文件\\n├── 📁 src/\\n│   ├── 📄 DataLoader.vue          组件实现文件\\n│   ├── 📄 DataLoader.ts           类型定义文件\\n\"},{\"url\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"relativePath\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"frontmatter\":{\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35fb9de79657\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b9de796573854d43b749734913b6633d\",\"useduuid\":\"b9de79657\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、问题描述\\n在 `packages\\\\theme-chalk\\\\src\\\\var\\\\theme-color.scss` 文件中，第46-51行的代码：\\n```scss\\nhtml[theme-color=\\\"ep-blue\\\"] {\\n  --vp-c-brand-1: {getCssVar(\\\"el-color-primary\\\")};\\n  --vp-c-brand-2: {getCssVar(\\\"el-color-primary-light-3\\\")};\\n  --vp-c-brand-3: {getCssVar(\\\"el-color-primary-light-5\\\")};\\n  --vp-c-brand-soft:\"},{\"url\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"relativePath\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"frontmatter\":{\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f360fd6478245\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"fd6478245cb1431bb8d59e27fb1861fb\",\"useduuid\":\"fd6478245\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"VitePress 处于 Vite 环境下，因此天然支持 Vite 插件。\\n 一、Vite 插件基础模板\\n首先介绍 Vite 插件的基础模板：\\n```ts\\nimport type { Plugin } from \\\"vite\\\";\\ninterface Options {\\n  // ...\\n}\\nexport default function VitePluginVitePressTemplate(option: Options = {}): Plugin {\\n  return {\\n    name: \\\"vite-plugin-vitepress-template\\\",\\n    // ...\\n  };\\n\"},{\"url\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"relativePath\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"frontmatter\":{\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f361eeded65d4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"eeded65d495b4775837aa95b4f4a8ef9\",\"useduuid\":\"eeded65d4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"在现代前端开发中，规范化的 Git 提交信息对于项目维护和版本管理至关重要。本文将详细介绍 husky、cz-git 和 @commitlint/cli 三个工具的使用方法，以及如何建立一套完整的 Git 提交规范体系。\\n\\n 一、Husky - Git 钩子工具\\n 1. 简介\\nHusky 是一个现代化的 Git 钩子管理工具，它允许我们在 Git 的各个生命周期节点（如 pre-commit、commit-msg 等）执行自定义脚本。通过 Husky，我们可以自动化执行代码检查、测试、提交信息验证等任务。\\n&gt; Git仓库：GitHub - typicode/husky: Git hook\"},{\"url\":\"/sdoc/01-开发/LV025-standard-version.html\",\"relativePath\":\"/sdoc/01-开发/LV025-standard-version.html\",\"frontmatter\":{\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f3627f71836b7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"7f71836b768d4190b3c6eee2e46fc8bf\",\"useduuid\":\"7f71836b7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Standard-Version是什么\\n 1. 简介\\nStandard-Version是一款遵循语义化版本（semver）和commit message标准规范的版本和Changelog自动化工具。它基于commit类型来自动更新版本号，例如新功能（feature）会更新次要版本号（minor），修复错误（bug fix）会更新补丁版本号（patch），而破坏性更改（BREAKING CHANGES）则会更新主要版本号（major）。这意味着开发者只需要专注于开发，而不需要担心版本号和Changelog的更新。\\n要使用Standard-Version，开发者需要遵循Conventional\"},{\"url\":\"/sdoc/01-开发/LV028-changesets.html\",\"relativePath\":\"/sdoc/01-开发/LV028-changesets.html\",\"frontmatter\":{\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f364206483106\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"2064831068a0408d89f6d0ade9d99a0b\",\"useduuid\":206483106}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Changesets是什么\\n 1. 简介\\nChangesets 是一个专为 monorepo 项目设计的版本管理和变更日志生成工具。与 Standard-Version 不同，Changesets 采用手动创建变更集（changeset）的方式，让开发者能够精确控制每个版本包含的变更内容。它特别适合多包管理的复杂项目，提供更灵活的版本控制策略。\\nChangesets 的核心思想是\\\"变更集驱动\\\"——开发者需要手动创建变更集文件来描述所做的更改，然后工具会根据这些变更集自动更新版本号、生成变更日志，并处理包之间的依赖关系。\\n核心特点：\\n- 在开发时，需要开发者提供本次变更涉及的包名称、升级版本\"},{\"url\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"relativePath\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"frontmatter\":{\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/common-component/126d5cf36f302a303d6142c2\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"03d6142c2a584c1aadc2b0f50ab095d3\",\"useduuid\":\"03d6142c2\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"excerpt\":\"\",\"capture\":\"&lt;script setup\\nimport { MtDataLoader } from \\\"vitepress-theme-mist\\\"\\n&lt;/sc \"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"467f65843da749569b64ac36e3924e8d\",\"useduuid\":\"467f65843\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-catalogue` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描 Markdown 文档并生成目录信息。该插件能够自动识别标记为目录页的文档，并为其生成结构化的目录数据，便于开发者创建美观实用的目录页面。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 目录数据自动生成\\n- 在 VitePress 启动时扫描项目中的 Markdown 文档\\n- 识别具有 `catalogue: true` 和 `path` 属性的文档作为目录页\\n- 根据指定路\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"frontmatter\":{\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f2a61acb4f9af\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1acb4f9afb8047e6bab8225453b7c346\",\"useduuid\":\"1acb4f9af\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"一、catalogue插件导入\\n在`vitepress-plugin-catalogue/src/index.ts`这样导入：\\n```typescript\\nexport default function VitePluginVitePressCatalogue(option: CatalogueOption = {}): Plugin & { name: string } {\\n  let isExecute = false;\\n  return {\\n    name: \\\"vite-plugin-vitepress-catalogue\\\",\\n    //...\\n      const {\\n     \"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"frontmatter\":{\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313aaf55185ce3\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f55185ce35f24f7ba0983b7751676468\",\"useduuid\":\"f55185ce3\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"`vitepress-plugin-permalink` 是一个适用于 VitePress 的 Vite 插件，用于实现永久链接（Permalink）功能。它允许用户为 Markdown 文档设置唯一的访问链接，即使文档路径发生移动，访问地址也不会发生变化。\\n 一、工作原理\\n插件提供两种方式实现永久链接：\\n 1. Proxy 方式\\n这种方式不会影响文件路径，而是在访问文件路径时，通过代理（拦截）将其转换为 `Permalink`。\\nProxy 方式类似于一个\\\"中间人\\\"，它在开发服务器层面拦截请求，当用户访问 permalink 时，插件会在后台将请求转发到实际的文件路径，但浏览器地址栏显示的仍\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"frontmatter\":{\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313ab195fbc397\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"195fbc397efd4ce58b656f68e87c5fe4\",\"useduuid\":\"195fbc397\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"自动侧边栏（自动导航栏）是 mist 主题文档体系里最核心的自动化插件之一：它在 VitePress 启动时扫描 `sdoc` 目录结构，自动生成 `themeConfig.nav`（顶部导航栏）和 `themeConfig.sidebar`（侧边栏）两份数据，免去手写配置、也免去文档增删后手动同步的工作。\\n本文是自动侧边栏系列的第一篇总览，讲清楚三件事：插件家族里三个包是什么关系、插件是怎么注册进 VitePress 的、以及内部两种解析模式（filePath / rewrites）的分野。后续四篇分工如下：\\n- LV103-自动侧边栏配置详解：全部配置项的作用、默认值与配置示例；\\n- LV\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"frontmatter\":{\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f11f658832348\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"6588323480cc49b7922f62950ab347b3\",\"useduuid\":658832348}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"本文是自动侧边栏系列的第二篇，覆盖全部配置项：主题默认配置怎么读、`navSidebarOption` 三层结构里每个字段的作用、以及 frontmatter 级的逐文档定制。模式的原理请回看 LV100-自动侧边栏总览。\\n所有配置项的类型定义在 `plugins/vitepress-auto-nav-sidebar/src/types.ts`，共三层：`NavSidebarOption`（顶层）→ `NavOption`（导航栏）+ `SidebarOption`（侧边栏）。\\n 一、配置入口与默认值\\n 1. 配置写在哪里\\nmist 主题用户在 `defineMistConfig` 的 `vi\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"frontmatter\":{\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3771f30f180842827\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"180842827e2342798caefa1dcf46adc4\",\"useduuid\":180842827}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"excerpt\":\"\",\"capture\":\"filePath 模式是自动侧边栏的默认解析规则：不依赖任何路由配置，直接扫描文件系统，目录怎么长，侧边栏就怎么生成。当前文档站（未启用 `createRewrites()`）走的就是这条路径。本文自顶向下拆解它的完整生成过程：入口流程、递归算法、文件名解析、标题来源，最后用本站真实目录做一遍全过程模拟。\\n源码位于 `plugins/vitepress-auto-nav-sidebar/src/filePathToSidebar.ts`（侧边栏）与 `plugins/vitepress-auto-nav-sidebar/src/filePathToNavigation.ts`（导航栏）。\\n 一\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"frontmatter\":{\"title\":\"LV109-自动侧边栏之rewrites模式\",\"date\":\"2026-09-20 19:48:48\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf377200ebb78685c6c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b78685c6c28946efbfd47a95a9edc97e\",\"useduuid\":\"b78685c6c\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV109-自动侧边栏之rewrites模式\",\"date\":\"2026-09-20 19:48:48\",\"excerpt\":\"\",\"capture\":\"rewrites 模式解决的是\\\"永久链接与侧边栏脱钩\\\"的问题：文档用 tdoc 配 permalink 之后，访问地址不再是文件路径，如果侧边栏还按文件路径生成链接，点进去就是 404。该模式以 rewrites 重写表为数据源，让侧边栏链接与永久链接始终一致。\\n本文是自动侧边栏系列第四篇，前置阅读：LV070-永久链接（permalink 机制）、LV100-自动侧边栏总览（模式判定）。源码位于 `plugins/vitepress-auto-nav-sidebar/src/rewritesToSidebar.ts` 与 `rewritesToNavigation.ts`。\\n 一、为什么需要\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV112-自动侧边栏的限制与避坑.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV112-自动侧边栏的限制与避坑.html\",\"frontmatter\":{\"title\":\"LV112-自动侧边栏的限制与避坑\",\"date\":\"2026-09-20 19:48:48\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf377202ef2c6c29be6\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"2c6c29be61c445d38bfa1576f7a1547e\",\"useduuid\":\"2c6c29be6\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV112-自动侧边栏的限制与避坑\",\"date\":\"2026-09-20 19:48:48\",\"excerpt\":\"\",\"capture\":\"本文是自动侧边栏系列最后一篇，汇总配置时\\\"不看源码不知道\\\"的限制：生成时机、忽略机制、命名约定匹配、排序规则，以及 README 与实际实现之间的偏差清单。前四篇见 总览、配置详解、filePath 模式、rewrites 模式。\\n 一、生成时机限制\\n 1. 启动时一次性生成\\n数据生成只发生在 Vite `config()` 钩子里，闭包变量 `isExecute` 保证 dev + build 全程只执行一次。因此运行期间的一切文件变动（新增、删除、改名、移动、改 frontmatter 标题）都不会反映到导航/侧边栏，必须重启 dev 服务或重新 build。改了文档标题侧边栏没变、新加的\"},{\"url\":\"/sdoc/03-插件/02-内置插件/LV001-img懒加载.html\",\"relativePath\":\"/sdoc/03-插件/02-内置插件/LV001-img懒加载.html\",\"frontmatter\":{\"title\":\"LV001-img懒加载\",\"date\":\"2026-09-20 19:28:18\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/builtin-plugin/126d5cf36f32379f8554b288\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f8554b288f1842dbb20a19785c5c3de8\",\"useduuid\":\"f8554b288\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-img懒加载\",\"date\":\"2026-09-20 19:28:18\",\"excerpt\":\"\",\"capture\":\"一、VitePress 内置图片懒加载功能\\nVitePress 内置了对 markdown 语法图片的懒加载支持。在配置文件中设置 `lazyLoading: true` 即可启用：\\n```javascript\\n// .vitepress/config.mts\\nexport default defineConfig({\\n  markdown: {\\n    image: {\\n      // 默认禁用；设置为 true 可为所有图片启用懒加载。\\n      lazyLoading: true,\\n    },\\n  },\\n});\\n```\\n功能特点：\\n- 仅对 markdown 语法 `` 的图片有效\"},{\"url\":\"/sdoc/04-使用/LV001-复制提示.html\",\"relativePath\":\"/sdoc/04-使用/LV001-复制提示.html\",\"frontmatter\":{\"title\":\"LV001-复制提示\",\"date\":\"2026-09-20 19:28:19\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/use/126d5cf36f331d83e36b1169\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"3e36b1169e344ad49f462e48c42eb96c\",\"useduuid\":\"3e36b1169\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-复制提示\",\"date\":\"2026-09-20 19:28:19\",\"excerpt\":\"\",\"capture\":\"Ctrl+C 复制提示\\n主题提供 复制提示 功能，当复制文本时，会在顶部添加一些提示语，在 `.vitepress/theme/index.ts` 中引入并使用：\\n```ts\\n// .vitepress/theme/index.ts\\n// https://vitepress.dev/guide/custom-theme\\nimport type { Theme } from \\\"vitepress\\\";\\nimport Mist, { useCopyBanner } from \\\"vitepress-theme-mist\\\";\\nimport MistLayoutProvider from \\\"./compo\"}],\"originPosts\":[{\"url\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"relativePath\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"frontmatter\":{\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f358aca00c973\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"aca00c97343e49b0969d34bd184045b4\",\"useduuid\":\"aca00c973\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、工作区\\n\\npnpm 内置了对单一存储库（也称为多包存储库、多项目存储库或整体存储库）的支持。你可以创建一个工作区来将多个项目联合到一个存储库中。\\n&gt; 工作区的根目录中必须有一个 `pnpm-workspace.yaml` 文件。\\n 1. 工作区协议\\n如果 linkWorkspacePackages 设置为 `true`，如果可用包与声明的范围匹配，pnpm 将从工作区链接包。例如，如果 `bar` 在其依赖中有 `\\\"foo\\\": \\\"^1.0.0\\\"` 并且 `foo@1.0.0` 在工作区中，则 `foo@1.0.0` 链接到 `bar`。但是，如果 `bar` 在依赖中有 `\\\"foo\\\"\"},{\"url\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"relativePath\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"frontmatter\":{\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35ac666f44fe\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"c666f44fe5f046c8aadb8491cd6f64bf\",\"useduuid\":\"c666f44fe\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、Typescript路径映射\\nTypescript 路径映射（Path Mapping）是一种允许开发者在导入模块时使用自定义路径别名而不是相对路径的功能。这使得代码更加清晰、易于维护，并且在重构项目结构时更加方便。\\n 1. 基本概念\\n路径映射通过在 `tsconfig.json` 文件中配置 `paths` 和 `baseUrl` 来实现。`baseUrl` 指定了非相对路径模块的基础目录，`paths` 则定义了路径别名与实际路径之间的映射关系。\\n路径映射的核心价值在于解决深层嵌套目录结构中的导入问题。当项目变得复杂时，相对路径可能会变成类似 `../../../../utils/he\"},{\"url\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"relativePath\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"frontmatter\":{\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35b1b55cd5b5\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1b55cd5b599645c698ef650c2ec2c57e\",\"useduuid\":\"1b55cd5b5\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、开发指南\\n主题的主入口文件为`packages/mist/index.ts`，这里的index.ts将会在vitepress站点的`.vitepress/theme/index.ts`中导入和调用。\\n 二、Workspace 机制详解\\n 1. 项目配置分析\\n 1.1 pnpm-workspace.yaml\\n```yaml\\n pnpm-workspace.yaml\\npackages:\\n  - docs\\n  - packages/*\\n```\\n这个配置定义了 Workspace 的范围，包含了 `packages` 目录下的所有子目录。\\n 1.2 packages/mist/package.js\"},{\"url\":\"/sdoc/01-开发/LV010-主题配置.html\",\"relativePath\":\"/sdoc/01-开发/LV010-主题配置.html\",\"frontmatter\":{\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35cbff754d8c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"bff754d8c11b4e32b841c3d7e9378444\",\"useduuid\":\"bff754d8c\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"<p>vitepress的配置合并。</p>\\n\",\"capture\":\"vitepress的配置合并。\\n 一、概述\\n当建立一个vitepress站点后，得到的默认配置文件如下：\\n```typescript\\nimport { defineConfig } from \\\"vitepress\\\";\\n// https://vitepress.dev/reference/site-config\\nexport default defineConfig({\\n  title: \\\"mist docs\\\",\\n  description: \\\"vitepress-theme-mist docs\\\",\\n  themeConfig: {\\n    // https://vitepress.dev/re\"},{\"url\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"relativePath\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"frontmatter\":{\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35e8787d3ad7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"8787d3ad7f354a63bb729e008862f309\",\"useduuid\":\"8787d3ad7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"DataLoader 组件导入过程分析\\n本文档详细分析了 DataLoader 组件在项目中的目录结构、各文件作用以及从组件实现到最终在 `@docs-site/vitepress-theme-mist` 主题中注册的完整导入链路。\\n 1. 目录结构分析\\n 1.1 目录结构\\n```bash\\n📁 DataLoader/\\n├── 📄 index.ts                    组件主入口文件\\n├── 📁 src/\\n│   ├── 📄 DataLoader.vue          组件实现文件\\n│   ├── 📄 DataLoader.ts           类型定义文件\\n\"},{\"url\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"relativePath\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"frontmatter\":{\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35fb9de79657\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b9de796573854d43b749734913b6633d\",\"useduuid\":\"b9de79657\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、问题描述\\n在 `packages\\\\theme-chalk\\\\src\\\\var\\\\theme-color.scss` 文件中，第46-51行的代码：\\n```scss\\nhtml[theme-color=\\\"ep-blue\\\"] {\\n  --vp-c-brand-1: {getCssVar(\\\"el-color-primary\\\")};\\n  --vp-c-brand-2: {getCssVar(\\\"el-color-primary-light-3\\\")};\\n  --vp-c-brand-3: {getCssVar(\\\"el-color-primary-light-5\\\")};\\n  --vp-c-brand-soft:\"},{\"url\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"relativePath\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"frontmatter\":{\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f360fd6478245\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"fd6478245cb1431bb8d59e27fb1861fb\",\"useduuid\":\"fd6478245\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"VitePress 处于 Vite 环境下，因此天然支持 Vite 插件。\\n 一、Vite 插件基础模板\\n首先介绍 Vite 插件的基础模板：\\n```ts\\nimport type { Plugin } from \\\"vite\\\";\\ninterface Options {\\n  // ...\\n}\\nexport default function VitePluginVitePressTemplate(option: Options = {}): Plugin {\\n  return {\\n    name: \\\"vite-plugin-vitepress-template\\\",\\n    // ...\\n  };\\n\"},{\"url\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"relativePath\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"frontmatter\":{\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f361eeded65d4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"eeded65d495b4775837aa95b4f4a8ef9\",\"useduuid\":\"eeded65d4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"在现代前端开发中，规范化的 Git 提交信息对于项目维护和版本管理至关重要。本文将详细介绍 husky、cz-git 和 @commitlint/cli 三个工具的使用方法，以及如何建立一套完整的 Git 提交规范体系。\\n\\n 一、Husky - Git 钩子工具\\n 1. 简介\\nHusky 是一个现代化的 Git 钩子管理工具，它允许我们在 Git 的各个生命周期节点（如 pre-commit、commit-msg 等）执行自定义脚本。通过 Husky，我们可以自动化执行代码检查、测试、提交信息验证等任务。\\n&gt; Git仓库：GitHub - typicode/husky: Git hook\"},{\"url\":\"/sdoc/01-开发/LV025-standard-version.html\",\"relativePath\":\"/sdoc/01-开发/LV025-standard-version.html\",\"frontmatter\":{\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f3627f71836b7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"7f71836b768d4190b3c6eee2e46fc8bf\",\"useduuid\":\"7f71836b7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Standard-Version是什么\\n 1. 简介\\nStandard-Version是一款遵循语义化版本（semver）和commit message标准规范的版本和Changelog自动化工具。它基于commit类型来自动更新版本号，例如新功能（feature）会更新次要版本号（minor），修复错误（bug fix）会更新补丁版本号（patch），而破坏性更改（BREAKING CHANGES）则会更新主要版本号（major）。这意味着开发者只需要专注于开发，而不需要担心版本号和Changelog的更新。\\n要使用Standard-Version，开发者需要遵循Conventional\"},{\"url\":\"/sdoc/01-开发/LV028-changesets.html\",\"relativePath\":\"/sdoc/01-开发/LV028-changesets.html\",\"frontmatter\":{\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f364206483106\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"2064831068a0408d89f6d0ade9d99a0b\",\"useduuid\":206483106}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Changesets是什么\\n 1. 简介\\nChangesets 是一个专为 monorepo 项目设计的版本管理和变更日志生成工具。与 Standard-Version 不同，Changesets 采用手动创建变更集（changeset）的方式，让开发者能够精确控制每个版本包含的变更内容。它特别适合多包管理的复杂项目，提供更灵活的版本控制策略。\\nChangesets 的核心思想是\\\"变更集驱动\\\"——开发者需要手动创建变更集文件来描述所做的更改，然后工具会根据这些变更集自动更新版本号、生成变更日志，并处理包之间的依赖关系。\\n核心特点：\\n- 在开发时，需要开发者提供本次变更涉及的包名称、升级版本\"},{\"url\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"relativePath\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"frontmatter\":{\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/common-component/126d5cf36f302a303d6142c2\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"03d6142c2a584c1aadc2b0f50ab095d3\",\"useduuid\":\"03d6142c2\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"excerpt\":\"\",\"capture\":\"&lt;script setup\\nimport { MtDataLoader } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 简介\\n第一个组件，主要是学习组件的写法和用法。\\n 基本用法\\n在 Markdown文档中添加以下内容：\\n```markdown\\n&lt;MtDataLoader /&gt;\\n```\\n 效果\\n&lt;MtDataLoader /&gt;\"},{\"url\":\"/sdoc/02-组件/01-公共组件/LV004-BackTop回到顶部.html\",\"relativePath\":\"/sdoc/02-组件/01-公共组件/LV004-BackTop回到顶部.html\",\"frontmatter\":{\"title\":\"LV004-BackTop回到顶部\",\"date\":\"2026-09-20 19:28:16\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/common-component/126d5cf36f302a3ddf2ac154\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":fa d7e4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"5260fd7e47ba47d68d22891fe3b9ddd1\",\"useduuid\":\"5260fd7e4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-ArticleBreadcrumb文章面包屑\",\"date\":\"2026-09-20 19:28:17\",\"excerpt\":\"<p>这一部分来了解一下ArticleBreadcrumb文章面包屑组件。</p>\\n\",\"capture\":\"这一部分来了解一下ArticleBreadcrumb文章面包屑组件。\\n&lt;script setup\\nimport { MtArticleBreadcrumb } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nArticleBreadcrumb（文章面包屑）是一个为文章页面设计的面包屑组件，它会根据当前页面的路径自动生成面包屑导航。该组件是基于基础的 Breadcrumb 组件构建的，但针对文章页面进行了优化。\\n 二、基础用法\\n 1. 默认用法\\n在文章页面中直接使用 ArticleBreadcrumb 组件，它会自动根据页面路径生成面\"},{\"url\":\"/sdoc/02-组件/02-主题组件/LV007-ArticleInfo文章信息.html\",\"relativePath\":\"/sdoc/02-组件/02-主题组件/LV007-ArticleInfo文章信息.html\",\"frontmatter\":{\"title\":\"LV007-ArticleInfo文章信息\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/theme-component/126d5cf36f31058918d30ca4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"918d30ca4b314931935d28af2c99b6c2\",\"useduuid\":\"918d30ca4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-ArticleInfo文章信息\",\"date\":\"2026-09-20 19:28:17\",\"excerpt\":\"<p>这一部分来了解一下ArticleInfo文章信息组件。</p>\\n\",\"capture\":\"这一部分来了解一下ArticleInfo文章信息组件。\\n&lt;script setup\\nimport { MtArticleInfo } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nArticleInfo（文章信息）是一个用于显示文章基本信息的组件，包括作者、创建时间、更新时间、分类、标签等内容。该组件会根据主题配置自动显示相应的信息，并支持在首页和文章页的不同展示需求。\\n 二、基础用法\\n 1. 默认用法\\n在文章页面中使用 ArticleInfo 组件，传入文章数据和作用域：\\nArticleInfo/basic\\n```vue\\n&lt\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"frontmatter\":{\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a80a26194d1\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"0a26194d1b4d444c881d6157883207e4\",\"useduuid\":\"0a26194d1\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-file-content-loader` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描和处理指定的文件内容。该插件将 VitePress 官方的构建时数据加载功能封装成独立的插件形式，使开发者能够更便捷地获取和处理项目中的 Markdown 文件内容。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 文件内容扫描与处理\\n- 在 VitePress 启动时扫描项目中指定的文件（默认为 Markdown 文档）\\n- 解析文件的 frontmatter\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"frontmatter\":{\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a9467f65843\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"467f65843da749569b64ac36e3924e8d\",\"useduuid\":\"467f65843\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-catalogue` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描 Markdown 文档并生成目录信息。该插件能够自动识别标记为目录页的文档，并为其生成结构化的目录数据，便于开发者创建美观实用的目录页面。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 目录数据自动生成\\n- 在 VitePress 启动时扫描项目中的 Markdown 文档\\n- 识别具有 `catalogue: true` 和 `path` 属性的文档作为目录页\\n- 根据指定路\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"frontmatter\":{\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f2a61acb4f9af\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1acb4f9afb8047e6bab8225453b7c346\",\"useduuid\":\"1acb4f9af\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"一、catalogue插件导入\\n在`vitepress-plugin-catalogue/src/index.ts`这样导入：\\n```typescript\\nexport default function VitePluginVitePressCatalogue(option: CatalogueOption = {}): Plugin & { name: string } {\\n  let isExecute = false;\\n  return {\\n    name: \\\"vite-plugin-vitepress-catalogue\\\",\\n    //...\\n      const {\\n     \"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"frontmatter\":{\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313aaf55185ce3\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f55185ce35f24f7ba0983b7751676468\",\"useduuid\":\"f55185ce3\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"`vitepress-plugin-permalink` 是一个适用于 VitePress 的 Vite 插件，用于实现永久链接（Permalink）功能。它允许用户为 Markdown 文档设置唯一的访问链接，即使文档路径发生移动，访问地址也不会发生变化。\\n 一、工作原理\\n插件提供两种方式实现永久链接：\\n 1. Proxy 方式\\n这种方式不会影响文件路径，而是在访问文件路径时，通过代理（拦截）将其转换为 `Permalink`。\\nProxy 方式类似于一个\\\"中间人\\\"，它在开发服务器层面拦截请求，当用户访问 permalink 时，插件会在后台将请求转发到实际的文件路径，但浏览器地址栏显示的仍\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"frontmatter\":{\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313ab195fbc397\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"195fbc397efd4ce58b656f68e87c5fe4\",\"useduuid\":\"195fbc397\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"自动侧边栏（自动导航栏）是 mist 主题文档体系里最核心的自动化插件之一：它在 VitePress 启动时扫描 `sdoc` 目录结构，自动生成 `themeConfig.nav`（顶部导航栏）和 `themeConfig.sidebar`（侧边栏）两份数据，免去手写配置、也免去文档增删后手动同步的工作。\\n本文是自动侧边栏系列的第一篇总览，讲清楚三件事：插件家族里三个包是什么关系、插件是怎么注册进 VitePress 的、以及内部两种解析模式（filePath / rewrites）的分野。后续四篇分工如下：\\n- LV103-自动侧边栏配置详解：全部配置项的作用、默认值与配置示例；\\n- LV\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"frontmatter\":{\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f11f658832348\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"6588323480cc49b7922f62950ab347b3\",\"useduuid\":658832348}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"本文是自动侧边栏系列的第二篇，覆盖全部配置项：主题默认配置怎么读、`navSidebarOption` 三层结构里每个字段的作用、以及 frontmatter 级的逐文档定制。模式的原理请回看 LV100-自动侧边栏总览。\\n所有配置项的类型定义在 `plugins/vitepress-auto-nav-sidebar/src/types.ts`，共三层：`NavSidebarOption`（顶层）→ `NavOption`（导航栏）+ `SidebarOption`（侧边栏）。\\n 一、配置入口与默认值\\n 1. 配置写在哪里\\nmist 主题用户在 `defineMistConfig` 的 `vi\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"frontmatter\":{\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3771f30f180842827\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"180842827e2342798caefa1dcf46adc4\",\"useduuid\":180842827}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"excerpt\":\"\",\"capture\":\"filePath 模式是自动侧边栏的默认解析规则：不依赖任何路由配置，直接扫描文件系统，目录怎么长，侧边栏就怎么生成。当前文档站（未启用 `createRewrites()`）走的就是这条路径。本文自顶向下拆解它的完整生成过程：入口流程、递归算法、文件名解析、标题来源，最后用本站真实目录做一遍全过程模拟。\\n源码位于 `plugins/vitepress-auto-nav-sidebar/src/filePathToSidebar.ts`（侧边栏）与 `plugins/vitepress-auto-nav-sidebar/src/filePathToNavigation.ts`（导航栏）。\\n 一\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"frontmatter\":{\"title\":\"LV109-自动侧边栏之rewrites模式\",\"date\":\"2026-09-20 19:48:48\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf377200ebb78685c6c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b78685c6c28946ef 931935d28af2c99b6c2\",\"useduuid\":\"918d30ca4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-ArticleInfo文章信息\",\"date\":\"2026-09-20 19:28:17\",\"excerpt\":\"<p>这一部分来了解一下ArticleInfo文章信息组件。</p>\\n\",\"capture\":\"这一部分来了解一下ArticleInfo文章信息组件。\\n&lt;script setup\\nimport { MtArticleInfo } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nArticleInfo（文章信息）是一个用于显示文章基本信息的组件，包括作者、创建时间、更新时间、分类、标签等内容。该组件会根据主题配置自动显示相应的信息，并支持在首页和文章页的不同展示需求。\\n 二、基础用法\\n 1. 默认用法\\n在文章页面中使用 ArticleInfo 组件，传入文章数据和作用域：\\nArticleInfo/basic\\n```vue\\n&lt\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"frontmatter\":{\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a80a26194d1\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"0a26194d1b4d444c881d6157883207e4\",\"useduuid\":\"0a26194d1\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-file-content-loader` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描和处理指定的文件内容。该插件将 VitePress 官方的构建时数据加载功能封装成独立的插件形式，使开发者能够更便捷地获取和处理项目中的 Markdown 文件内容。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 文件内容扫描与处理\\n- 在 VitePress 启动时扫描项目中指定的文件（默认为 Markdown 文档）\\n- 解析文件的 frontmatter\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"frontmatter\":{\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a9467f65843\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"467f65843da749569b64ac36e3924e8d\",\"useduuid\":\"467f65843\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-catalogue` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描 Markdown 文档并生成目录信息。该插件能够自动识别标记为目录页的文档，并为其生成结构化的目录数据，便于开发者创建美观实用的目录页面。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 目录数据自动生成\\n- 在 VitePress 启动时扫描项目中的 Markdown 文档\\n- 识别具有 `catalogue: true` 和 `path` 属性的文档作为目录页\\n- 根据指定路\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"frontmatter\":{\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313aaf55185ce3\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f55185ce35f24f7ba0983b7751676468\",\"useduuid\":\"f55185ce3\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"`vitepress-plugin-permalink` 是一个适用于 VitePress 的 Vite 插件，用于实现永久链接（Permalink）功能。它允许用户为 Markdown 文档设置唯一的访问链接，即使文档路径发生移动，访问地址也不会发生变化。\\n 一、工作原理\\n插件提供两种方式实现永久链接：\\n 1. Proxy 方式\\n这种方式不会影响文件路径，而是在访问文件路径时，通过代理（拦截）将其转换为 `Permalink`。\\nProxy 方式类似于一个\\\"中间人\\\"，它在开发服务器层面拦截请求，当用户访问 permalink 时，插件会在后台将请求转发到实际的文件路径，但浏览器地址栏显示的仍\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"frontmatter\":{\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo- \",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"4585ab8e616e4e0ab58ec4ac3acf8f67\",\"useduuid\":\"4585ab8e6\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV031-Breadcrumb面包屑\",\"date\":\"2026-09-20 19:28:16\",\"excerpt\":\"<p>这一部分来了解一下Breadcrumb面包屑组件。</p>\\n\",\"capture\":\"这一部分来了解一下Breadcrumb面包屑组件。\\n&lt;script setup\\nimport { MtBreadcrumb, MtBreadcrumbItem } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nBreadcrumb（面包屑）是一种导航组件，用于显示用户在网站或应用中的当前位置。它可以帮助用户理解他们所在的层级结构，并提供快速返回上一级或首页的导航路径。\\n 特点\\n- 简洁直观：清晰的层级结构展示\\n- 高度可定制：支持自定义分隔符\\n- 灵活使用：支持纯文本、图标、链接等多种内容形式\\n- 无障碍支持：内置ARIA属性，提\"},{\"url\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"relativePath\":\"/sdoc/01-开发/LV001-pnpm工作区.html\",\"frontmatter\":{\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f358aca00c973\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"aca00c97343e49b0969d34bd184045b4\",\"useduuid\":\"aca00c973\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-pnpm工作区\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、工作区\\n\\npnpm 内置了对单一存储库（也称为多包存储库、多项目存储库或整体存储库）的支持。你可以创建一个工作区来将多个项目联合到一个存储库中。\\n&gt; 工作区的根目录中必须有一个 `pnpm-workspace.yaml` 文件。\\n 1. 工作区协议\\n如果 linkWorkspacePackages 设置为 `true`，如果可用包与声明的范围匹配，pnpm 将从工作区链接包。例如，如果 `bar` 在其依赖中有 `\\\"foo\\\": \\\"^1.0.0\\\"` 并且 `foo@1.0.0` 在工作区中，则 `foo@1.0.0` 链接到 `bar`。但是，如果 `bar` 在依赖中有 `\\\"foo\\\"\"},{\"url\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"relativePath\":\"/sdoc/01-开发/LV004-TS路径映射与包作用域.html\",\"frontmatter\":{\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35ac666f44fe\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"c666f44fe5f046c8aadb8491cd6f64bf\",\"useduuid\":\"c666f44fe\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-TS路径映射与包作用域\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"\",\"capture\":\"一、Typescript路径映射\\nTypescript 路径映射（Path Mapping）是一种允许开发者在导入模块时使用自定义路径别名而不是相对路径的功能。这使得代码更加清晰、易于维护，并且在重构项目结构时更加方便。\\n 1. 基本概念\\n路径映射通过在 `tsconfig.json` 文件中配置 `paths` 和 `baseUrl` 来实现。`baseUrl` 指定了非相对路径模块的基础目录，`paths` 则定义了路径别名与实际路径之间的映射关系。\\n路径映射的核心价值在于解决深层嵌套目录结构中的导入问题。当项目变得复杂时，相对路径可能会变成类似 `../../../../utils/he\"},{\"url\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"relativePath\":\"/sdoc/01-开发/LV007-主题入口分析.html\",\"frontmatter\":{\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35b1b55cd5b5\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1b55cd5b599645c698ef650c2ec2c57e\",\"useduuid\":\"1b55cd5b5\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-主题入口分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、开发指南\\n主题的主入口文件为`packages/mist/index.ts`，这里的index.ts将会在vitepress站点的`.vitepress/theme/index.ts`中导入和调用。\\n 二、Workspace 机制详解\\n 1. 项目配置分析\\n 1.1 pnpm-workspace.yaml\\n```yaml\\n pnpm-workspace.yaml\\npackages:\\n  - docs\\n  - packages/*\\n```\\n这个配置定义了 Workspace 的范围，包含了 `packages` 目录下的所有子目录。\\n 1.2 packages/mist/package.js\"},{\"url\":\"/sdoc/01-开发/LV010-主题配置.html\",\"relativePath\":\"/sdoc/01-开发/LV010-主题配置.html\",\"frontmatter\":{\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35cbff754d8c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"bff754d8c11b4e32b841c3d7e9378444\",\"useduuid\":\"bff754d8c\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-主题配置\",\"date\":\"2026-09-20 19:28:15\",\"excerpt\":\"<p>vitepress的配置合并。</p>\\n\",\"capture\":\"vitepress的配置合并。\\n 一、概述\\n当建立一个vitepress站点后，得到的默认配置文件如下：\\n```typescript\\nimport { defineConfig } from \\\"vitepress\\\";\\n// https://vitepress.dev/reference/site-config\\nexport default defineConfig({\\n  title: \\\"mist docs\\\",\\n  description: \\\"vitepress-theme-mist docs\\\",\\n  themeConfig: {\\n    // https://vitepress.dev/re\"},{\"url\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"relativePath\":\"/sdoc/01-开发/LV013-DataLoader组件分析.html\",\"frontmatter\":{\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35e8787d3ad7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"8787d3ad7f354a63bb729e008862f309\",\"useduuid\":\"8787d3ad7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV013-DataLoader组件分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"DataLoader 组件导入过程分析\\n本文档详细分析了 DataLoader 组件在项目中的目录结构、各文件作用以及从组件实现到最终在 `@docs-site/vitepress-theme-mist` 主题中注册的完整导入链路。\\n 1. 目录结构分析\\n 1.1 目录结构\\n```bash\\n📁 DataLoader/\\n├── 📄 index.ts                    组件主入口文件\\n├── 📁 src/\\n│   ├── 📄 DataLoader.vue          组件实现文件\\n│   ├── 📄 DataLoader.ts           类型定义文件\\n\"},{\"url\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"relativePath\":\"/sdoc/01-开发/LV016-SCSS变量未展开问题分析.html\",\"frontmatter\":{\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f35fb9de79657\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b9de796573854d43b749734913b6633d\",\"useduuid\":\"b9de79657\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV016-SCSS变量未展开问题分析\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、问题描述\\n在 `packages\\\\theme-chalk\\\\src\\\\var\\\\theme-color.scss` 文件中，第46-51行的代码：\\n```scss\\nhtml[theme-color=\\\"ep-blue\\\"] {\\n  --vp-c-brand-1: {getCssVar(\\\"el-color-primary\\\")};\\n  --vp-c-brand-2: {getCssVar(\\\"el-color-primary-light-3\\\")};\\n  --vp-c-brand-3: {getCssVar(\\\"el-color-primary-light-5\\\")};\\n  --vp-c-brand-soft:\"},{\"url\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"relativePath\":\"/sdoc/01-开发/LV019-Vite插件.html\",\"frontmatter\":{\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f360fd6478245\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"fd6478245cb1431bb8d59e27fb1861fb\",\"useduuid\":\"fd6478245\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV019-Vite插件\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"VitePress 处于 Vite 环境下，因此天然支持 Vite 插件。\\n 一、Vite 插件基础模板\\n首先介绍 Vite 插件的基础模板：\\n```ts\\nimport type { Plugin } from \\\"vite\\\";\\ninterface Options {\\n  // ...\\n}\\nexport default function VitePluginVitePressTemplate(option: Options = {}): Plugin {\\n  return {\\n    name: \\\"vite-plugin-vitepress-template\\\",\\n    // ...\\n  };\\n\"},{\"url\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"relativePath\":\"/sdoc/01-开发/LV022-Git提交规范与工具集成.html\",\"frontmatter\":{\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f361eeded65d4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"eeded65d495b4775837aa95b4f4a8ef9\",\"useduuid\":\"eeded65d4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV022-Git提交规范与工具集成\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"在现代前端开发中，规范化的 Git 提交信息对于项目维护和版本管理至关重要。本文将详细介绍 husky、cz-git 和 @commitlint/cli 三个工具的使用方法，以及如何建立一套完整的 Git 提交规范体系。\\n\\n 一、Husky - Git 钩子工具\\n 1. 简介\\nHusky 是一个现代化的 Git 钩子管理工具，它允许我们在 Git 的各个生命周期节点（如 pre-commit、commit-msg 等）执行自定义脚本。通过 Husky，我们可以自动化执行代码检查、测试、提交信息验证等任务。\\n&gt; Git仓库：GitHub - typicode/husky: Git hook\"},{\"url\":\"/sdoc/01-开发/LV025-standard-version.html\",\"relativePath\":\"/sdoc/01-开发/LV025-standard-version.html\",\"frontmatter\":{\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f3627f71836b7\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"7f71836b768d4190b3c6eee2e46fc8bf\",\"useduuid\":\"7f71836b7\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV025-standard-version\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Standard-Version是什么\\n 1. 简介\\nStandard-Version是一款遵循语义化版本（semver）和commit message标准规范的版本和Changelog自动化工具。它基于commit类型来自动更新版本号，例如新功能（feature）会更新次要版本号（minor），修复错误（bug fix）会更新补丁版本号（patch），而破坏性更改（BREAKING CHANGES）则会更新主要版本号（major）。这意味着开发者只需要专注于开发，而不需要担心版本号和Changelog的更新。\\n要使用Standard-Version，开发者需要遵循Conventional\"},{\"url\":\"/sdoc/01-开发/LV028-changesets.html\",\"relativePath\":\"/sdoc/01-开发/LV028-changesets.html\",\"frontmatter\":{\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/develop/126d5cf36f2f364206483106\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"2064831068a0408d89f6d0ade9d99a0b\",\"useduuid\":206483106}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV028-changesets\",\"date\":\"2026-09-20 19:28:15\",\"capture\":\"一、Changesets是什么\\n 1. 简介\\nChangesets 是一个专为 monorepo 项目设计的版本管理和变更日志生成工具。与 Standard-Version 不同，Changesets 采用手动创建变更集（changeset）的方式，让开发者能够精确控制每个版本包含的变更内容。它特别适合多包管理的复杂项目，提供更灵活的版本控制策略。\\nChangesets 的核心思想是\\\"变更集驱动\\\"——开发者需要手动创建变更集文件来描述所做的更改，然后工具会根据这些变更集自动更新版本号、生成变更日志，并处理包之间的依赖关系。\\n核心特点：\\n- 在开发时，需要开发者提供本次变更涉及的包名称、升级版本\"}],\"sortPostsByDate\":[{\"url\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV109-自动侧边栏之rewrites模式.html\",\"frontmatter\":{\"title\":\"LV109-自动侧边栏之rewrites模式\",\"date\":\"2026-09-20 19:48:48\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf377200ebb78685c6c\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"b78685c6c28946efbfd47a95a9edc97e\",\"useduuid\":\"b78685c6c\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV109-自动侧边栏之rewrites模式\",\"date\":\"2026-09-20 19:48:48\",\"excerpt\":\"\",\"capture\":\"rewrites 模式解决的是\\\"永久链接与侧边栏脱钩\\\"的问题：文档用 tdoc 配 permalink 之后，访问地址不再是文件路径，如果侧边栏还按文件路径生成链接，点进去就是 404。该模式以 rewrites 重写表为数据源，让侧边栏链接与永久链接始终一致。\\n本文是自动侧边栏系列第四篇，前置阅读：LV070-永久链接（permalink 机制）、LV100-自动侧边栏总览（模式判定）。源码位于 `plugins/vitepress-auto-nav-sidebar/src/rewritesToSidebar.ts` 与 `rewritesToNavigation.ts`。\\n 一、为什么需要\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV112-自动侧边栏的限制与避坑.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV112-自动侧边栏的限制与避坑.html\",\"frontmatter\":{\"title\":\"LV112-自动侧边栏的限制与避坑\",\"date\":\"2026-09-20 19:48:48\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf377202ef2c6c29be6\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"2c6c29be61c445d38bfa1576f7a1547e\",\"useduuid\":\"2c6c29be6\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV112-自动侧边栏的限制与避坑\",\"date\":\"2026-09-20 19:48:48\",\"excerpt\":\"\",\"capture\":\"本文是自动侧边栏系列最后一篇，汇总配置时\\\"不看源码不知道\\\"的限制：生成时机、忽略机制、命名约定匹配、排序规则，以及 README 与实际实现之间的偏差清单。前四篇见 总览、配置详解、filePath 模式、rewrites 模式。\\n 一、生成时机限制\\n 1. 启动时一次性生成\\n数据生成只发生在 Vite `config()` 钩子里，闭包变量 `isExecute` 保证 dev + build 全程只执行一次。因此运行期间的一切文件变动（新增、删除、改名、移动、改 frontmatter 标题）都不会反映到导航/侧边栏，必须重启 dev 服务或重新 build。改了文档标题侧边栏没变、新加的\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV106-自动侧边栏之filePath模式.html\",\"frontmatter\":{\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3771f30f180842827\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"180842827e2342798caefa1dcf46adc4\",\"useduuid\":180842827}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV106-自动侧边栏之filePath模式\",\"date\":\"2026-09-20 19:48:47\",\"excerpt\":\"\",\"capture\":\"filePath 模式是自动侧边栏的默认解析规则：不依赖任何路由配置，直接扫描文件系统，目录怎么长，侧边栏就怎么生成。当前文档站（未启用 `createRewrites()`）走的就是这条路径。本文自顶向下拆解它的完整生成过程：入口流程、递归算法、文件名解析、标题来源，最后用本站真实目录做一遍全过程模拟。\\n源码位于 `plugins/vitepress-auto-nav-sidebar/src/filePathToSidebar.ts`（侧边栏）与 `plugins/vitepress-auto-nav-sidebar/src/filePathToNavigation.ts`（导航栏）。\\n 一\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV043-目录页的rewrite模式.html\",\"frontmatter\":{\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f2a61acb4f9af\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"1acb4f9afb8047e6bab8225453b7c346\",\"useduuid\":\"1acb4f9af\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV043-目录页的rewrite模式\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"一、catalogue插件导入\\n在`vitepress-plugin-catalogue/src/index.ts`这样导入：\\n```typescript\\nexport default function VitePluginVitePressCatalogue(option: CatalogueOption = {}): Plugin & { name: string } {\\n  let isExecute = false;\\n  return {\\n    name: \\\"vite-plugin-vitepress-catalogue\\\",\\n    //...\\n      const {\\n     \"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV103-自动侧边栏配置详解.html\",\"frontmatter\":{\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf3701f11f658832348\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"6588323480cc49b7922f62950ab347b3\",\"useduuid\":658832348}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV103-自动侧边栏配置详解\",\"date\":\"2026-09-20 19:30:55\",\"excerpt\":\"\",\"capture\":\"本文是自动侧边栏系列的第二篇，覆盖全部配置项：主题默认配置怎么读、`navSidebarOption` 三层结构里每个字段的作用、以及 frontmatter 级的逐文档定制。模式的原理请回看 LV100-自动侧边栏总览。\\n所有配置项的类型定义在 `plugins/vitepress-auto-nav-sidebar/src/types.ts`，共三层：`NavSidebarOption`（顶层）→ `NavOption`（导航栏）+ `SidebarOption`（侧边栏）。\\n 一、配置入口与默认值\\n 1. 配置写在哪里\\nmist 主题用户在 `defineMistConfig` 的 `vi\"},{\"url\":\"/sdoc/04-使用/LV001-复制提示.html\",\"relativePath\":\"/sdoc/04-使用/LV001-复制提示.html\",\"frontmatter\":{\"title\":\"LV001-复制提示\",\"date\":\"2026-09-20 19:28:19\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/use/126d5cf36f331d83e36b1169\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"3e36b1169e344ad49f462e48c42eb96c\",\"useduuid\":\"3e36b1169\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-复制提示\",\"date\":\"2026-09-20 19:28:19\",\"excerpt\":\"\",\"capture\":\"Ctrl+C 复制提示\\n主题提供 复制提示 功能，当复制文本时，会在顶部添加一些提示语，在 `.vitepress/theme/index.ts` 中引入并使用：\\n```ts\\n// .vitepress/theme/index.ts\\n// https://vitepress.dev/guide/custom-theme\\nimport type { Theme } from \\\"vitepress\\\";\\nimport Mist, { useCopyBanner } from \\\"vitepress-theme-mist\\\";\\nimport MistLayoutProvider from \\\"./compo\"},{\"url\":\"/sdoc/03-插件/02-内置插件/LV001-img懒加载.html\",\"relativePath\":\"/sdoc/03-插件/02-内置插件/LV001-img懒加载.html\",\"frontmatter\":{\"title\":\"LV001-img懒加载\",\"date\":\"2026-09-20 19:28:18\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/builtin-plugin/126d5cf36f32379f8554b288\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f8554b288f1842dbb20a19785c5c3de8\",\"useduuid\":\"f8554b288\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-img懒加载\",\"date\":\"2026-09-20 19:28:18\",\"excerpt\":\"\",\"capture\":\"一、VitePress 内置图片懒加载功能\\nVitePress 内置了对 markdown 语法图片的懒加载支持。在配置文件中设置 `lazyLoading: true` 即可启用：\\n```javascript\\n// .vitepress/config.mts\\nexport default defineConfig({\\n  markdown: {\\n    image: {\\n      // 默认禁用；设置为 true 可为所有图片启用懒加载。\\n      lazyLoading: true,\\n    },\\n  },\\n});\\n```\\n功能特点：\\n- 仅对 markdown 语法 `` 的图片有效\"},{\"url\":\"/sdoc/02-组件/02-主题组件/LV001-Democode组件.html\",\"relativePath\":\"/sdoc/02-组件/02-主题组件/LV001-Democode组件.html\",\"frontmatter\":{\"title\":\"LV001-Democode组件\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/theme-component/126d5cf36f31056caebf07aa\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"caebf07aa6924cbd9a7f34a813c4913f\",\"useduuid\":\"caebf07aa\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-Democode组件\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n本文档深入分析 VitePress 主题中的 `demo` 插件 (`packages/markdown/plugins/demo.ts`) 和 `MtDemoCode` 组件 (`packages/components/theme/DemoCode/src/index.vue`)。这两个组件协同工作，实现在 Markdown 文档中嵌入可交互的 Vue 组件示例，并提供源代码查看、复制等功能。\\n 二、工作原理总览\\n整个流程可以分为以下几个步骤：\\n（1）Markdown 解析阶段：VitePress 使用 `demo` 插件解析 Markdown 中的 `（2）组件生成阶段：插件读取\"},{\"url\":\"/sdoc/02-组件/02-主题组件/LV004-ArticleBreadcrumb文章面包屑.html\",\"relativePath\":\"/sdoc/02-组件/02-主题组件/LV004-ArticleBreadcrumb文章面包屑.html\",\"frontmatter\":{\"title\":\"LV004-ArticleBreadcrumb文章面包屑\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/theme-component/126d5cf36f310575260fd7e4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"5260fd7e47ba47d68d22891fe3b9ddd1\",\"useduuid\":\"5260fd7e4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-ArticleBreadcrumb文章面包屑\",\"date\":\"2026-09-20 19:28:17\",\"excerpt\":\"<p>这一部分来了解一下ArticleBreadcrumb文章面包屑组件。</p>\\n\",\"capture\":\"这一部分来了解一下ArticleBreadcrumb文章面包屑组件。\\n&lt;script setup\\nimport { MtArticleBreadcrumb } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nArticleBreadcrumb（文章面包屑）是一个为文章页面设计的面包屑组件，它会根据当前页面的路径自动生成面包屑导航。该组件是基于基础的 Breadcrumb 组件构建的，但针对文章页面进行了优化。\\n 二、基础用法\\n 1. 默认用法\\n在文章页面中直接使用 ArticleBreadcrumb 组件，它会自动根据页面路径生成面\"},{\"url\":\"/sdoc/02-组件/02-主题组件/LV007-ArticleInfo文章信息.html\",\"relativePath\":\"/sdoc/02-组件/02-主题组件/LV007-ArticleInfo文章信息.html\",\"frontmatter\":{\"title\":\"LV007-ArticleInfo文章信息\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/theme-component/126d5cf36f31058918d30ca4\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"918d30ca4b314931935d28af2c99b6c2\",\"useduuid\":\"918d30ca4\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV007-ArticleInfo文章信息\",\"date\":\"2026-09-20 19:28:17\",\"excerpt\":\"<p>这一部分来了解一下ArticleInfo文章信息组件。</p>\\n\",\"capture\":\"这一部分来了解一下ArticleInfo文章信息组件。\\n&lt;script setup\\nimport { MtArticleInfo } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 一、组件介绍\\nArticleInfo（文章信息）是一个用于显示文章基本信息的组件，包括作者、创建时间、更新时间、分类、标签等内容。该组件会根据主题配置自动显示相应的信息，并支持在首页和文章页的不同展示需求。\\n 二、基础用法\\n 1. 默认用法\\n在文章页面中使用 ArticleInfo 组件，传入文章数据和作用域：\\nArticleInfo/basic\\n```vue\\n&lt\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV010-file-content-loader.html\",\"frontmatter\":{\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a80a26194d1\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"0a26194d1b4d444c881d6157883207e4\",\"useduuid\":\"0a26194d1\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV010-file-content-loader\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-file-content-loader` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描和处理指定的文件内容。该插件将 VitePress 官方的构建时数据加载功能封装成独立的插件形式，使开发者能够更便捷地获取和处理项目中的 Markdown 文件内容。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 文件内容扫描与处理\\n- 在 VitePress 启动时扫描项目中指定的文件（默认为 Markdown 文档）\\n- 解析文件的 frontmatter\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV040-catalogue分析文档.html\",\"frontmatter\":{\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313a9467f65843\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"467f65843da749569b64ac36e3924e8d\",\"useduuid\":\"467f65843\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV040-catalogue分析文档\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"一、概述\\n`vitepress-plugin-catalogue` 是 Teek 主题生态系统中的一个重要插件，专门用于在 VitePress 项目构建时扫描 Markdown 文档并生成目录信息。该插件能够自动识别标记为目录页的文档，并为其生成结构化的目录数据，便于开发者创建美观实用的目录页面。\\n本文将围绕其设计思路、技术实现、配置选项以及与其他组件间的协作机制展开全面剖析。\\n 二、基本功能\\n 1. 目录数据自动生成\\n- 在 VitePress 启动时扫描项目中的 Markdown 文档\\n- 识别具有 `catalogue: true` 和 `path` 属性的文档作为目录页\\n- 根据指定路\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV070-永久链接.html\",\"frontmatter\":{\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313aaf55185ce3\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"f55185ce35f24f7ba0983b7751676468\",\"useduuid\":\"f55185ce3\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV070-永久链接\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"`vitepress-plugin-permalink` 是一个适用于 VitePress 的 Vite 插件，用于实现永久链接（Permalink）功能。它允许用户为 Markdown 文档设置唯一的访问链接，即使文档路径发生移动，访问地址也不会发生变化。\\n 一、工作原理\\n插件提供两种方式实现永久链接：\\n 1. Proxy 方式\\n这种方式不会影响文件路径，而是在访问文件路径时，通过代理（拦截）将其转换为 `Permalink`。\\nProxy 方式类似于一个\\\"中间人\\\"，它在开发服务器层面拦截请求，当用户访问 permalink 时，插件会在后台将请求转发到实际的文件路径，但浏览器地址栏显示的仍\"},{\"url\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"relativePath\":\"/sdoc/03-插件/01-独立插件包/LV100-自动侧边栏总览.html\",\"frontmatter\":{\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/plugin/standalone-plugin/126d5cf36f313ab195fbc397\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"195fbc397efd4ce58b656f68e87c5fe4\",\"useduuid\":\"195fbc397\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV100-自动侧边栏总览\",\"date\":\"2026-09-20 19:28:17\",\"capture\":\"自动侧边栏（自动导航栏）是 mist 主题文档体系里最核心的自动化插件之一：它在 VitePress 启动时扫描 `sdoc` 目录结构，自动生成 `themeConfig.nav`（顶部导航栏）和 `themeConfig.sidebar`（侧边栏）两份数据，免去手写配置、也免去文档增删后手动同步的工作。\\n本文是自动侧边栏系列的第一篇总览，讲清楚三件事：插件家族里三个包是什么关系、插件是怎么注册进 VitePress 的、以及内部两种解析模式（filePath / rewrites）的分野。后续四篇分工如下：\\n- LV103-自动侧边栏配置详解：全部配置项的作用、默认值与配置示例；\\n- LV\"},{\"url\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"relativePath\":\"/sdoc/02-组件/01-公共组件/LV001-DataLoader数据加载.html\",\"frontmatter\":{\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/common-component/126d5cf36f302a303d6142c2\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"03d6142c2a584c1aadc2b0f50ab095d3\",\"useduuid\":\"03d6142c2\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV001-DataLoader数据加载\",\"date\":\"2026-09-20 19:28:16\",\"excerpt\":\"\",\"capture\":\"&lt;script setup\\nimport { MtDataLoader } from \\\"vitepress-theme-mist\\\"\\n&lt;/script&gt;\\n 简介\\n第一个组件，主要是学习组件的写法和用法。\\n 基本用法\\n在 Markdown文档中添加以下内容：\\n```markdown\\n&lt;MtDataLoader /&gt;\\n```\\n 效果\\n&lt;MtDataLoader /&gt;\"},{\"url\":\"/sdoc/02-组件/01-公共组件/LV004-BackTop回到顶部.html\",\"relativePath\":\"/sdoc/02-组件/01-公共组件/LV004-BackTop回到顶部.html\",\"frontmatter\":{\"title\":\"LV004-BackTop回到顶部\",\"date\":\"2026-09-20 19:28:16\",\"icon\":\"famicons:logo-markdown\",\"permalink\":\"/sdoc/component/common-component/126d5cf36f302a3ddf2ac154\",\"index\":true,\"tags\":null,\"categories\":null,\"copyright\":false,\"keywords\":null,\"cover\":null,\"comments\":null,\"mathjax\":null,\"top\":null,\"description\":null,\"tdoc\":{\"detailDate\":{},\"fulluuid\":\"ddf2ac15449546968edf430c021cc15f\",\"useduuid\":\"ddf2ac154\"}},\"author\":{\"name\":\"苏木\",\"link\":\"https://github.com/docs-site\"},\"title\":\"LV004-BackTop回到顶部\",\"da
